<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <!-- Metallic Black Obsidian Body Gradient -->
    <linearGradient id="blackObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222834" />
      <stop offset="35%" stop-color="#111318" />
      <stop offset="70%" stop-color="#090c12" />
      <stop offset="100%" stop-color="#1c2027" />
    </linearGradient>

    <!-- Cockpit Dark Glass Canopy Gradient -->
    <linearGradient id="darkGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="50%" stop-color="#121722" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Vibrant Orange Accent Gradient (#FF6A00 -> #FF8A3D) -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#ff8a3d" />
    </linearGradient>

    <!-- High-Contrast Specular Edge Outline Gradient -->
    <linearGradient id="whiteEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadow for Elevation -->
    <filter id="carHighShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="20" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="black-orange-concept-hypercar" filter="url(#carHighShadow)">
    <!-- Wide Performance Tires with Rim Detail -->
    <rect x="220" y="38" width="142" height="44" rx="10" fill="#040608" stroke="#222834" stroke-width="2" />
    <rect x="220" y="368" width="142" height="44" rx="10" fill="#040608" stroke="#222834" stroke-width="2" />
    <rect x="840" y="38" width="142" height="44" rx="10" fill="#040608" stroke="#222834" stroke-width="2" />
    <rect x="840" y="368" width="142" height="44" rx="10" fill="#040608" stroke="#222834" stroke-width="2" />

    <!-- Vibrant Orange Brake Caliper Accents -->
    <rect x="270" y="46" width="42" height="8" rx="2" fill="url(#orangeGlow)" />
    <rect x="270" y="396" width="42" height="8" rx="2" fill="url(#orangeGlow)" />
    <rect x="890" y="46" width="42" height="8" rx="2" fill="url(#orangeGlow)" />
    <rect x="890" y="396" width="42" height="8" rx="2" fill="url(#orangeGlow)" />

    <!-- Aerodynamic Black Graphite Body Silhouette (High Contrast Edge) -->
    <path d="M 160,225 
             C 160,158 210,88 320,78 
             L 760,78 
             C 900,78 1040,128 1090,188 
             L 1110,225 
             L 1090,262 
             C 1040,322 900,372 760,372 
             L 320,372 
             C 210,362 160,292 160,225 Z" 
          fill="url(#blackObsidian)" stroke="#3b4759" stroke-width="3" />

    <!-- Sharp Outer White Specular Outline for Pop Against Navy -->
    <path d="M 162,225 
             C 162,160 212,90 320,80 
             L 760,80 
             C 898,80 1038,130 1088,190" 
          fill="none" stroke="url(#whiteEdge)" stroke-width="2" />

    <!-- Front Carbon Fiber Splitter Wing -->
    <path d="M 1070,185 L 1145,210 L 1145,240 L 1070,265 Z" fill="#090c12" stroke="#222834" stroke-width="2" />

    <!-- Side Vents & Orange Accent Channel Lines -->
    <path d="M 340,78 L 440,118 L 440,132 L 340,88 Z" fill="#05070a" />
    <path d="M 340,372 L 440,332 L 440,318 L 340,362 Z" fill="#05070a" />

    <line x1="350" y1="84" x2="440" y2="122" stroke="#ff6a00" stroke-width="3" />
    <line x1="350" y1="366" x2="440" y2="328" stroke="#ff6a00" stroke-width="3" />

    <!-- Hood Vents with Orange Accent Insets -->
    <polygon points="900,175 975,195 975,205 900,195" fill="#05070a" />
    <polygon points="900,275 975,255 975,245 900,255" fill="#05070a" />
    <line x1="910" y1="187" x2="965" y2="201" stroke="#ff6a00" stroke-width="2.5" />
    <line x1="910" y1="263" x2="965" y2="249" stroke="#ff6a00" stroke-width="2.5" />

    <!-- Sleek Cockpit Canopy Glass -->
    <path d="M 480,118 
             C 620,118 740,136 800,183 
             L 800,267 
             C 740,314 620,332 480,332 
             C 420,332 380,302 380,225 
             C 380,148 420,118 480,118 Z" 
          fill="url(#darkGlass)" stroke="#222834" stroke-width="3" />

    <!-- White Specular Glass Reflection Highlight -->
    <path d="M 490,132 C 610,132 710,148 765,188 C 725,158 625,145 490,145 Z" fill="#f5f5f5" opacity="0.35" />

    <!-- Carbon Fiber Roof Spine -->
    <path d="M 480,138 C 580,138 680,153 730,193 L 730,257 C 680,297 580,312 480,312 C 440,312 420,282 420,225 C 420,168 440,138 480,138 Z" fill="#090c12" />

    <!-- Orange Roof Center Highlight -->
    <line x1="400" y1="225" x2="760" y2="225" stroke="#ff6a00" stroke-width="2.5" />

    <!-- Side Mirrors with Orange Tips -->
    <path d="M 720,70 L 760,48 L 780,73 Z" fill="#1c2027" stroke="#ff6a00" stroke-width="1.5" />
    <path d="M 720,380 L 760,402 L 780,377 Z" fill="#1c2027" stroke="#ff6a00" stroke-width="1.5" />

    <!-- High Contrast LED Headlight Strips (Bright White + Orange Accent Tip) -->
    <polygon points="1020,152 1075,173 1060,183 1010,162" fill="#ffffff" />
    <polygon points="1020,298 1075,277 1060,267 1010,288" fill="#ffffff" />
    <polyline points="1022,154 1078,175" stroke="#ff6a00" stroke-width="3.5" />
    <polyline points="1022,296 1078,275" stroke="#ff6a00" stroke-width="3.5" />

    <!-- Tail Light Strip (Vibrant Orange Glow) -->
    <rect x="150" y="140" width="12" height="170" rx="4" fill="#05070a" />
    <rect x="158" y="150" width="6" height="150" rx="3" fill="url(#orangeGlow)" />
  </g>
</svg>
