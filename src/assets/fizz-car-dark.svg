<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <!-- Metallic Body Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35" />
      <stop offset="35%" stop-color="#1c2026" />
      <stop offset="70%" stop-color="#121519" />
      <stop offset="100%" stop-color="#22262d" />
    </linearGradient>
    
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1114" />
      <stop offset="50%" stop-color="#1a1d22" />
      <stop offset="100%" stop-color="#0f1114" />
    </linearGradient>

    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c96b3c" />
      <stop offset="100%" stop-color="#e07d4b" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="carShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="18" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="top-down-dark-concept-car" filter="url(#carShadow)">
    <!-- Exposed Wide Tires with Metallic Rims -->
    <rect x="220" y="40" width="140" height="42" rx="10" fill="#0b0d0f" stroke="#2a2e35" stroke-width="2" />
    <rect x="220" y="368" width="140" height="42" rx="10" fill="#0b0d0f" stroke="#2a2e35" stroke-width="2" />
    <rect x="840" y="40" width="140" height="42" rx="10" fill="#0b0d0f" stroke="#2a2e35" stroke-width="2" />
    <rect x="840" y="368" width="140" height="42" rx="10" fill="#0b0d0f" stroke="#2a2e35" stroke-width="2" />

    <!-- Brake Calipers - Warm Orange Accent -->
    <rect x="270" y="48" width="40" height="8" rx="2" fill="url(#accentOrange)" />
    <rect x="270" y="394" width="40" height="8" rx="2" fill="url(#accentOrange)" />
    <rect x="890" y="48" width="40" height="8" rx="2" fill="url(#accentOrange)" />
    <rect x="890" y="394" width="40" height="8" rx="2" fill="url(#accentOrange)" />

    <!-- Main Aerodynamic Chassis / Body Silhouette -->
    <path d="M 160,225 
             C 160,160 210,90 320,80 
             L 760,80 
             C 900,80 1040,130 1090,190 
             L 1110,225 
             L 1090,260 
             C 1040,320 900,370 760,370 
             L 320,370 
             C 210,360 160,290 160,225 Z" 
          fill="url(#bodyGrad)" stroke="#3a404a" stroke-width="3" />

    <!-- Front Carbon Splitter Wings -->
    <path d="M 1070,185 L 1140,210 L 1140,240 L 1070,265 Z" fill="#111417" stroke="#2a2e35" stroke-width="2" />
    
    <!-- Active Side Vents & Flaps -->
    <path d="M 340,80 L 440,120 L 440,135 L 340,90 Z" fill="#0f1114" />
    <path d="M 340,370 L 440,330 L 440,315 L 340,360 Z" fill="#0f1114" />

    <!-- Hood Heat Extraction Vents with Orange Accent Inset -->
    <polygon points="900,175 970,195 970,205 900,195" fill="#0f1114" />
    <polygon points="900,275 970,255 970,245 900,255" fill="#0f1114" />
    <line x1="910" y1="187" x2="960" y2="201" stroke="#c96b3c" stroke-width="2" />
    <line x1="910" y1="263" x2="960" y2="249" stroke="#c96b3c" stroke-width="2" />

    <!-- Sleek Glass Canopy Cockpit -->
    <path d="M 480,120 
             C 620,120 740,138 800,185 
             L 800,265 
             C 740,312 620,330 480,330 
             C 420,330 380,300 380,225 
             C 380,150 420,120 480,120 Z" 
          fill="#090b0d" stroke="#22262d" stroke-width="3" />

    <!-- Glass Reflection Curved Highlight -->
    <path d="M 490,135 C 610,135 710,150 760,190 C 720,160 620,148 490,148 Z" fill="#3a404a" opacity="0.4" />

    <!-- Carbon Fiber Roof Spine -->
    <path d="M 480,140 C 580,140 680,155 730,195 L 730,255 C 680,295 580,310 480,310 C 440,310 420,280 420,225 C 420,170 440,140 480,140 Z" fill="url(#roofGrad)" />

    <!-- Roof Center Longitudinal Line -->
    <line x1="400" y1="225" x2="760" y2="225" stroke="#c96b3c" stroke-width="2" opacity="0.8" />

    <!-- Sculpted Side Rear Hips & Side Mirrors -->
    <path d="M 720,72 L 760,50 L 780,75 Z" fill="#2a2e35" stroke="#3a404a" stroke-width="1.5" />
    <path d="M 720,378 L 760,400 L 780,375 Z" fill="#2a2e35" stroke="#3a404a" stroke-width="1.5" />

    <!-- Ultra-Slim LED Headlight Strips (Warm White / Cyan / Amber Glow) -->
    <polygon points="1020,155 1070,175 1055,185 1010,165" fill="#f2f0ea" />
    <polygon points="1020,295 1070,275 1055,265 1010,285" fill="#f2f0ea" />
    <polyline points="1025,158 1072,177" stroke="#c96b3c" stroke-width="3" />
    <polyline points="1025,292 1072,273" stroke="#c96b3c" stroke-width="3" />

    <!-- Rear Diffuser & Light Bar -->
    <rect x="150" y="140" width="12" height="170" rx="4" fill="#111417" />
    <rect x="158" y="150" width="6" height="150" rx="3" fill="#c96b3c" />
  </g>
</svg>
